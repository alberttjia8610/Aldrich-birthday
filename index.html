<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aldrich Matteo Tjia 1st Birthday</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap">
<style>
:root{--sky:#bfe8f7;--sky2:#e9f7fc;--ink:#25282e;--card:#ffffff;--muted:#4f5864;--leaf:#4fae5c;--btn:#25282e;--btnt:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#17344a;--sky2:#0f2535;--ink:#f2f5f7;--card:#1f3a50;--muted:#b6c6d3;--btn:#ffffff;--btnt:#25282e}}
:root[data-theme="dark"]{--sky:#17344a;--sky2:#0f2535;--ink:#f2f5f7;--card:#1f3a50;--muted:#b6c6d3;--btn:#ffffff;--btnt:#25282e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"Fredoka",system-ui,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(var(--sky),var(--sky2));min-height:100vh;overflow-x:hidden}
#sky{position:fixed;inset:0;overflow:hidden;z-index:0}
.bl{position:absolute;bottom:-90px;cursor:pointer;animation:rise linear infinite;will-change:transform}
.bl i{display:block;width:100%;height:100%;border-radius:50% 50% 47% 47%;animation:sway ease-in-out infinite;position:relative;box-shadow:inset -6px -8px 0 rgba(0,0,0,.08),inset 7px 7px 0 rgba(255,255,255,.35)}
.bl i::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:34px;margin-left:-1px;background:var(--muted);opacity:.45}
.bl.pop{animation:none;transform:scale(1.5);opacity:0;transition:.25s}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-125vh)}}
@keyframes sway{0%,100%{transform:translateX(-14px) rotate(-5deg)}50%{transform:translateX(14px) rotate(5deg)}}
.wrap{max-width:520px;margin:0 auto;padding:24px 20px 48px;position:relative;z-index:1;text-align:center}
.panda{width:180px;height:auto;display:block;margin:0 auto;overflow:visible}
.arm{transform-origin:150px 150px;animation:wave 1.4s ease-in-out infinite}
.head{animation:bob 2.8s ease-in-out infinite;transform-origin:110px 150px}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
@keyframes bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.kicker{margin:12px 0 0;font-size:1.1rem;color:var(--muted)}
h1{font-size:clamp(2rem,9.5vw,2.9rem);line-height:1.05;margin:6px 0 8px;font-weight:700}
.age{display:inline-block;background:var(--leaf);color:#fff;border-radius:999px;padding:6px 22px;font-weight:700;font-size:1.3rem;transform:rotate(-3deg)}
.card{background:var(--card);border-radius:28px;padding:10px 22px;margin-top:26px;text-align:left;box-shadow:0 6px 0 rgba(37,40,46,.12)}
.row{display:flex;gap:14px;align-items:center;padding:14px 0}
.row+.row{border-top:2px dashed rgba(120,140,150,.35)}
.ic{font-size:1.7rem;line-height:1}
.row b{display:block;font-size:1.15rem}
.row span{color:var(--muted)}
.btns{display:grid;gap:10px;margin-top:22px}
.btn{display:block;text-align:center;text-decoration:none;font:inherit;font-weight:500;background:var(--btn);color:var(--btnt);padding:14px;border-radius:999px}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
.btn:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}
.zoo{font-size:1.9rem;margin-top:26px;letter-spacing:6px}
#qrv{display:none}
#qrbox{background:#fff;display:inline-block;padding:16px;border-radius:20px;margin:14px 0}
#qrurl{word-break:break-all;color:var(--muted);font-size:.9rem}
body.qr #inv{display:none}body.qr #qrv{display:block}
@media (prefers-reduced-motion:reduce){.bl,.bl i,.arm,.head{animation:none}.bl{bottom:auto;top:20%}}

#deco{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.cloud{position:absolute;height:34px;width:110px;background:#fff;border-radius:40px;opacity:.85;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:48px;height:48px;left:16px;top:-22px}.cloud::after{width:36px;height:36px;left:54px;top:-14px}
.c1{top:7%;left:-140px;animation-duration:70s}.c2{top:22%;left:-140px;animation-duration:95s;animation-delay:-40s;transform:scale(.8)}.c3{top:48%;left:-140px;animation-duration:85s;animation-delay:-20s;transform:scale(1.1)}
@keyframes drift{to{translate:calc(100vw + 300px) 0}}
.star{position:absolute;color:#ffd23f;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
.hill{position:absolute;left:-10%;right:-10%;bottom:-70px;height:150px;background:#6cc57a;border-radius:50% 50% 0 0}
.h2{background:#4fae5c;left:-35%;right:25%;bottom:-90px;height:140px}
.bam{position:absolute;bottom:0;width:14px;border-radius:7px 7px 0 0;background:repeating-linear-gradient(#7ccf6f 0 64px,#3f8f49 64px 68px);transform-origin:bottom;animation:bsw 5s ease-in-out infinite}
@keyframes bsw{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.pk{position:absolute;bottom:20px;font-size:2.2rem}
.cf{position:absolute;top:-20px;width:9px;height:14px;opacity:.9;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
.photo{position:relative;width:210px;height:210px;margin:20px auto 4px}
.photo::before,.photo::after{content:"";position:absolute;top:-16px;width:72px;height:72px;border-radius:50%;background:#25282e}
.photo::before{left:-8px}.photo::after{right:-8px}
.photo img{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;border:6px solid #fff;box-shadow:0 6px 0 rgba(37,40,46,.15)}
@media (prefers-reduced-motion:reduce){.cloud,.star,.bam,.cf{animation:none}.cloud{left:10%}}

.stage{position:relative;width:270px;margin:0 auto}
.stage::before{content:"";position:absolute;inset:-10px 0 0;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,255,255,.55) 40%,rgba(255,255,255,0) 70%);z-index:0}
.panda{position:relative;z-index:1;width:240px;filter:drop-shadow(0 8px 0 rgba(37,40,46,.12))}
.photo{width:min(270px,74vw);height:auto;aspect-ratio:3/4;margin:30px auto 22px}
.photo::before,.photo::after{top:-22px;width:62px;height:62px}
.photo::before{left:-12px}.photo::after{right:-12px}
.photo img{border-radius:28px;border-width:7px}
.paws i{position:absolute;bottom:-16px;width:50px;height:36px;border-radius:50%;background:#25282e;z-index:2}
.paws i:first-child{left:26px}.paws i:last-child{right:26px}
.paws i::before,.paws i::after{content:"";position:absolute;top:8px;width:7px;height:7px;border-radius:50%;background:#ff9aa2}
.paws i::before{left:14px}.paws i::after{left:28px}
.pk.big{font-size:3.2rem}
.em{position:absolute;bottom:-60px;font-size:1.5rem;animation:rise linear infinite}
.zoo{font-size:2.2rem;letter-spacing:4px}
@media (prefers-reduced-motion:reduce){.em{animation:none;bottom:30%}}
</style>
</head>
